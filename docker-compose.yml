# Copy .env.example to .env and configure it before starting.
# Start: docker compose -f docker-compose.yml up -d
services:
  app:
    image: ghcr.io/phillipunzen/haproxy-management-console:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${APP_BIND:-0.0.0.0}:${APP_PORT:-8100}:8000"
    environment:
      DB_HOST: ${DB_HOST:?Set DB_HOST in .env}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:?Set DB_NAME in .env}
      DB_USER: ${DB_USER:?Set DB_USER in .env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in .env}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      APP_ORIGIN: ${APP_ORIGIN:?Set APP_ORIGIN to the browser URL in .env}
      AGENT_DOWNLOAD_ORIGIN: ${AGENT_DOWNLOAD_ORIGIN:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      METRICS_INTERVAL: ${METRICS_INTERVAL:-30}
      METRICS_RAW_HOURS: ${METRICS_RAW_HOURS:-2}
      METRICS_FINE_DAYS: ${METRICS_FINE_DAYS:-1}
      METRICS_RETENTION_DAYS: ${METRICS_RETENTION_DAYS:-7}
      AGENT_CA_FILE: ${AGENT_CA_FILE:-}
    # Optional internal CA: enable this mount and set AGENT_CA_FILE in .env.
    # volumes:
    #   - ./agent-ca-bundle.pem:/certs/agent-ca-bundle.pem:ro
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  # Optional public file server. Never pass .env or management credentials here.
  agent-downloads:
    profiles: [agent-downloads]
    image: ghcr.io/phillipunzen/haproxy-management-console:${IMAGE_TAG:-latest}
    restart: unless-stopped
    command: [uvicorn, backend.agent_downloads:app, --host, 0.0.0.0, --port, "8001", --workers, "1", --no-proxy-headers, --no-access-log, --no-server-header, --limit-concurrency, "32", --backlog, "64", --timeout-keep-alive, "2", --h11-max-incomplete-event-size, "8192"]
    ports:
      - "${AGENT_DOWNLOAD_BIND:-127.0.0.1}:${AGENT_DOWNLOAD_PORT:-8101}:8001"
    networks: [agent-downloads]
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 64
    mem_limit: 128m
    cpus: 0.5
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8001/api/agent-installer', method='HEAD'), timeout=4)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

networks:
  agent-downloads: {}
