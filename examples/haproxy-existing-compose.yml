# Beispiel für /srv/haproxy: zunächst nach docs/AGENT.md vorbereiten.
# Bestehende haproxy.cfg und dnsmapping.cfg nach ./config kopieren.
# Fehlerseiten aus dem verwendeten Image nach ./config/errors übernehmen (siehe Anleitung).
# Der Verzeichnis-Mount verdeckt die im Image enthaltenen Fehlerseiten.
# Leere Mount-Ziele ./config/certs und ./config/vhosts vorher anlegen.
# ./run muss für UID/GID des HAProxy-Prozesses beschreibbar sein.
networks:
  dockernet:
    external: true

services:
  haproxy:
    image: haproxy:3.2-alpine
    container_name: haproxy
    command:
      - haproxy
      - -f
      - /usr/local/etc/haproxy/haproxy.cfg
      - -f
      - /usr/local/etc/haproxy/vhosts
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config:/usr/local/etc/haproxy:ro
      - ./certs:/usr/local/etc/haproxy/certs:ro
      - ./vhosts:/usr/local/etc/haproxy/vhosts:ro
      - ./run:/run/haproxy:rw
    networks:
      - dockernet
