services:
  app:
    build: .
    image: haproxy-control:0.1.0
    restart: unless-stopped
    env_file: .env
    ports:
      - "${APP_BIND:-0.0.0.0}:${APP_PORT:-8100}:8000"
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
